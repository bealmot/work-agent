# work-agent Hermes configuration.
# Copy to ~/.hermes/cli-config.yaml (or merge if one exists).
# Keys follow NousResearch/hermes-agent cli-config.yaml.example.

model:
  # llama-server serves whatever weights are loaded regardless of this value,
  # but Hermes requires the field. Any non-empty string works.
  default: "qwen3.6-35b-a3b"
  provider: "openai"                   # llama-server is OpenAI-compatible
  base_url: "http://localhost:8080/v1" # llama-server default (was :1234 under LM Studio)
  context_length: 65536                # must match -c in scripts/serve.sh; hermes floor is 64k

skills:
  creation_nudge_interval: 15
  # Read-only external skills from the cloned repo; adjust path if cloned
  # elsewhere. Hermes-created skills still write to ~/.hermes/skills/.
  external_dirs:
    - ~/work-agent/skills

agent:
  max_turns: 60

# OS-level GUI control via cua-driver (background: does not move your cursor
# or steal focus). Install with: bash setup/04-computer-use.sh
tools:
  - computer_use

computer_use:
  cua_telemetry: false   # Hermes' default; pinned here so it stays explicit

mcp_servers:
  playwright:
    command: npx
    args:
      - "-y"
      - "@playwright/mcp@0.0.32"
      # Dedicated persistent profile driving the INSTALLED Chrome.
      #
      # Not CDP-against-your-real-profile: Chrome 136+ refuses
      # --remote-debugging-port on the default user-data-dir as a security
      # change, and managed/corporate policy may strip the flag outright.
      # Confirmed failing on this machine 2026-08-05; the profile path below
      # was confirmed working (SSO passed first try) 2026-07-10.
      #
      # Not Playwright's bundled Chromium either: SSO/conditional-access
      # commonly rejects it as an unmanaged browser. --browser chrome uses
      # the real installed Chrome with a separate profile directory.
      #
      # Log into your work tools once in this profile; state persists after.
      #
      # __HOME__ is substituted by scripts/install-hermes-config.sh.
      # MCP args get NO tilde expansion — this must be an absolute path.
      - "--browser"
      - "chrome"
      - "--user-data-dir"
      - "__HOME__/.work-agent-profile"
    timeout: 120

    # Legacy alternative — attach to a CDP endpoint started by
    # scripts/chrome-debug.sh. Only works where policy still permits
    # --remote-debugging-port. Swap the four args above for:
    #   - "--cdp-endpoint"
    #   - "http://localhost:9222"
