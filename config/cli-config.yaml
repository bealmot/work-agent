# work-agent Hermes configuration.
# Copy to ~/.hermes/cli-config.yaml (or merge if one exists).
# Keys follow NousResearch/hermes-agent cli-config.yaml.example.

model:
  # llama-server serves whatever weights are loaded regardless of this value,
  # but Hermes requires the field. Any non-empty string works.
  default: "qwen3.6-35b-a3b"
  provider: "openai"                   # llama-server is OpenAI-compatible
  base_url: "http://localhost:8080/v1" # llama-server default (was :1234 under LM Studio)
  context_length: 65536                # must match -c in scripts/serve.sh; hermes floor is 64k

skills:
  creation_nudge_interval: 15
  # Read-only external skills from the cloned repo; adjust path if cloned
  # elsewhere. Hermes-created skills still write to ~/.hermes/skills/.
  external_dirs:
    - __HOME__/work-agent/skills
    # cua-driver's own version-matched skill pack. Hermes is NOT in the
    # driver's auto-detect list (Claude Code, Codex, OpenClaw, OpenCode), so
    # it must be listed explicitly. Install with `cua-driver skills install`
    # and confirm the path with `cua-driver skills path` -- uncomment and
    # correct if it differs on this machine.
    # - __HOME__/.cua/skills

agent:
  max_turns: 60

# OS-level GUI control via cua-driver (background: does not move your cursor
# or steal focus). Install with: bash setup/04-computer-use.sh
#
# We talk to cua-driver over its NATIVE MCP surface rather than through
# Hermes' `computer_use` wrapper. The wrapper exposes a reduced action set
# that omits the AX-tree scoping parameters (max_elements, max_depth, query,
# include_screenshot) -- which are the main levers against context blow-up on
# large web apps -- and it has known defects: hermes-agent#39242 (capture
# mode='vision' calls a cua-driver tool that does not exist, returns 0x0) and
# hermes-agent#24170.
#
# Deliberately NOT also setting `tools: [computer_use]`: both paths drive the
# same daemon, and two owners is a fight worth avoiding. To go back, drop this
# server and restore the two-line tools/computer_use block.
mcp_servers:
  cua:
    command: cua-driver
    args:
      - "mcp"
    timeout: 120
